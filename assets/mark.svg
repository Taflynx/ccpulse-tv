<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ccpulse-tv">
  <defs>
    <linearGradient id="t-body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1c3566"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="t-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#7cc8ff"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#16295a"/>
      <stop offset="1" stop-color="#060c20"/>
    </radialGradient>
  </defs>
  <!-- antennas -->
  <g stroke="#7cc8ff" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="20" x2="38" y2="5"/>
    <line x1="76" y1="20" x2="90" y2="5"/>
  </g>
  <circle cx="38" cy="5" r="4" fill="#7cc8ff"/>
  <circle cx="90" cy="5" r="4" fill="#7cc8ff"/>
  <!-- feet -->
  <rect x="24" y="112" width="18" height="10" rx="4" fill="#0a1330"/>
  <rect x="86" y="112" width="18" height="10" rx="4" fill="#0a1330"/>
  <!-- body -->
  <rect x="6" y="18" width="116" height="98" rx="24" fill="url(#t-body)"/>
  <rect x="6" y="18" width="116" height="98" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- screen -->
  <rect x="17" y="29" width="94" height="70" rx="12" fill="url(#t-glow)"/>
  <rect x="17" y="29" width="94" height="70" rx="12" fill="none" stroke="#7cc8ff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- the cycle ring + usage bars, on screen -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#7cc8ff" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="115 164" transform="rotate(-90 64 64)"/>
  <g fill="url(#t-bar)">
    <rect x="49" y="64" width="6" height="12" rx="3"/>
    <rect x="57.5" y="56" width="6" height="20" rx="3"/>
    <rect x="66" y="50" width="6" height="26" rx="3"/>
  </g>
  <rect x="74.5" y="60" width="6" height="16" rx="3" fill="#ffffff"/>
  <!-- glass highlight -->
  <path d="M23 35 h34 l-34 26 z" fill="#ffffff" fill-opacity="0.05"/>
  <!-- power LED: the orange "now" dot -->
  <circle cx="64" cy="108" r="3.6" fill="#ff8a5c"/>
</svg>
